<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Мини хотелски мениджър</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Гости</h2>
<form id="guestForm">
    <input id="gname" placeholder="Име">
    <input id="gemail" placeholder="Email">
    <button>Добави гост</button>
</form>
<ul id="guestList"></ul>
<h2>Резервации</h2>
<form id="reservationForm">
    <input id="rguest" placeholder="Име на гост">
    <input id="rroom" placeholder="Стая">
    <button>Добави резервация</button>
</form>
<ul id="reservationList"></ul>
<script src="main.js"></script>
</body>
</html>
