<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хотелска Система</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <h1 class="logo">Hotel Management</h1>

        <ul class="nav-menu">
            <li><a class="nav-link" onclick="showSection('home')">Начало</a></li>
            <li><a class="nav-link" onclick="showSection('reservations')">Резервации</a></li>
            <li><a class="nav-link" onclick="showSection('services')">Услуги</a></li>

            <li id="adminRoomsMenu">
                <a class="nav-link" onclick="showSection('rooms')">Стаи</a>
            </li>

            <li id="adminGuestsMenu">
                <a class="nav-link" onclick="showSection('guests')">Гости</a>
            </li>

            <li>
                <a class="nav-link" onclick="logout()">Изход</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container">

<section id="home" class="section active">
    <div class="hero">
        <h2>Добре дошли</h2>
    </div>
    <div id="loyaltyCard"></div>
    <div id="suggestionsCard"></div>
</section>

<section id="reservations" class="section">
    <h2>Резервации</h2>

    <select id="resRoomId" class="input-field"></select>

    <input type="date" id="resCheckIn" class="input-field">
    <input type="date" id="resCheckOut" class="input-field">

    <!-- ПАКЕТНИ ОФЕРТИ -->
    <div style="margin:10px 0; padding:10px; border:1px solid #ddd; border-radius:6px;">
        <h3>Пакетна оферта (по избор)</h3>
        <select id="resPackage" class="input-field">
            <option value="">Без пакет (по дати)</option>
            <option value="weekend">Уикенд пакет — 2 нощувки, -10%</option>
            <option value="week">Седмичен пакет — 7 нощувки, -15%</option>
            <option value="spa">Спа пакет — 3 нощувки, -5% + СПА включено</option>
        </select>
    </div>

    <!-- SERVICES -->
    <div style="margin:10px 0; padding:10px; border:1px solid #ddd; border-radius:6px;">
        <h3>Допълнителни услуги</h3>
        <div id="serviceCheckboxes"></div>
    </div>

    <button class="btn btn-primary" onclick="addReservation()">Създай</button>

    <div id="reservationsList"></div>
</section>

<section id="guests" class="section">
    <h2>Гости</h2>
    <div id="guestsList"></div>
</section>

<section id="rooms" class="section">
    <h2>Стаи (Admin)</h2>

    <div id="roomForm">
        <input id="roomId" class="input-field">
        <input id="roomType" class="input-field">
        <input id="roomPrice" class="input-field">
        <input id="roomCapacity" class="input-field">

        <button class="btn btn-success" onclick="addRoom()">Добави</button>
    </div>

    <div id="roomsList"></div>
</section>

<section id="services" class="section">
    <h2>Услуги</h2>

    <div id="adminServiceForm" style="display:none; margin-bottom:1rem; padding:1rem; border:1px solid #ddd; border-radius:6px;">
        <h3>Добави услуга</h3>
        <input id="serviceName" class="input-field" placeholder="Име на услугата">
        <input id="serviceDescription" class="input-field" placeholder="Описание">
        <input id="servicePrice" class="input-field" type="number" placeholder="Цена (лв)">
        <button class="btn btn-success" onclick="addService()">Добави</button>
    </div>

    <div id="servicesGrid" class="services-grid"></div>
</section>

</div>

<script src="main.js"></script>
</body>
</html>
